services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data          # generated questionnaires land here
      - ./evals:/app/evals        # results and scorecards land here
      - ./.cache:/app/.cache      # model response cache survives container restarts
    ports:
      - "8501:8501"               # review screen: docker compose run --service-ports agent streamlit run app/review_app.py --server.address 0.0.0.0
