  expected_status: answered
  expected_citations:
    - {doc: KR-AI-007, page: 1, evidence: "Kestrel does not use Customer Data, including prompts, uploaded documents, and generated outputs, to train or fine-tune any AI models."}
  required_facts: ["does not use Customer Data"]

- id: COV-011
  category: covered
  section: AI and Data Use
  question: How long do you retain prompts and AI-generated outputs?
  expected_status: answered
  expected_citations:
    - {doc: KR-AI-007, page: 1, evidence: "Prompt and output logs are retained for 30 days and then deleted."}
  required_facts: ["30 days"]
  notes: Hard negative for conflict detection. DPA also says "30 days" but about post-termination deletion. Same number, different subject, so not a conflict.

- id: COV-012
  category: covered
  section: Availability
  question: What uptime commitment do you offer?
  expected_status: answered
  expected_citations:
    - {doc: KR-SLA-005, page: 1, evidence: "at least 99.9% for the Business and Enterprise editions, and at least 99.95% for the Enterprise Premium edition"}
    - {doc: KR-PROD-001, page: 3, evidence: "99.9% monthly uptime commitment on the Business and Enterprise editions"}
  required_facts: ["99.9%", "99.95%"]
  notes: Hard negative. 99.9% vs 99.95% is tiered by edition, not a conflict. Flagging it as a conflict is a false positive.

- id: COV-013
  category: covered
  section: Availability
  question: What service credits apply if you miss the uptime commitment?
  expected_status: answered
  expected_citations:
    - {doc: KR-SLA-005, page: 2, evidence: "Below commitment, at or above 99.0% 10% Below 99.0%, at or above 95.0% 25% Below 95.0% 50%"}
  required_facts: ["10%", "25%", "50%"]

