# ---------------------------------------------------------------------------
# 3. CONFLICTING DOCUMENTS - identify the conflict (two phrasings each)
# ---------------------------------------------------------------------------
- id: CF-001
  category: conflict
  section: Incident Response
  question: What is your timeline for notifying customers of a security breach?
  expected_status: conflict
  conflict:
    topic: breach notification window
    sources:
      - {doc: KR-SEC-002, page: 4, evidence: "within 72 hours of confirmation", value: "72 hours"}
      - {doc: KR-DPA-006, page: 3, evidence: "in any event within 48 hours", value: "48 hours"}
  route_to: legal
  notes: The DPA is contractual and is likely the binding figure, but the agent must surface both and let legal decide.

- id: CF-002
  category: conflict
  section: Incident Response
  question: If our data is compromised, how quickly will you tell us?
  expected_status: conflict
  conflict:
    topic: breach notification window
    sources:
      - {doc: KR-SEC-002, page: 4, evidence: "within 72 hours of confirmation", value: "72 hours"}
      - {doc: KR-DPA-006, page: 3, evidence: "in any event within 48 hours", value: "48 hours"}
  route_to: legal

- id: CF-003
  category: conflict
  section: Business Continuity
  question: How long are backups retained?
  expected_status: conflict
  conflict:
    topic: database backup retention
    sources:
      - {doc: KR-SEC-002, page: 4, evidence: "Backups are retained for 30 days", value: "30 days"}
      - {doc: KR-BCP-004, page: 1, evidence: "Encrypted database backups are retained for 90 days.", value: "90 days"}
  route_to: security

- id: CF-004
  category: conflict
  section: Business Continuity
  question: For production databases, what is the backup retention period?
  expected_status: conflict
  conflict:
    topic: database backup retention
    sources:
      - {doc: KR-SEC-002, page: 4, evidence: "Backups are retained for 30 days", value: "30 days"}
      - {doc: KR-BCP-004, page: 1, evidence: "Encrypted database backups are retained for 90 days.", value: "90 days"}
  route_to: security

- id: CF-005
  category: conflict
  section: Business Continuity
  question: What is your Recovery Point Objective (RPO)?
  expected_status: conflict
  conflict:
    topic: recovery point objective
    sources:
      - {doc: KR-BCP-004, page: 1, evidence: "Recovery Point Objective (RPO) of 4 hours", value: "4 hours"}
      - {doc: KR-SLA-005, page: 3, evidence: "Recovery Point Objective (RPO) of 1 hour", value: "1 hour"}
  route_to: security

- id: CF-006
  category: conflict
  section: Business Continuity
  question: In a disaster, what is the maximum amount of data we could lose?
  expected_status: conflict
  conflict:
    topic: recovery point objective
    sources:
      - {doc: KR-BCP-004, page: 1, evidence: "Recovery Point Objective (RPO) of 4 hours", value: "4 hours"}
      - {doc: KR-SLA-005, page: 3, evidence: "Recovery Point Objective (RPO) of 1 hour", value: "1 hour"}
  route_to: security
  notes: The question never says "RPO". The agent has to map the concept.

- id: CF-007
  category: conflict
  section: Support
  question: What is the initial response time for a Severity 1 support ticket?
  expected_status: conflict
  conflict:
    topic: Severity 1 initial response time
    sources:
