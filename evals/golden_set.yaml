# Golden evaluation set for the Grounded RFP Response Agent.
#
# Every expectation here is machine-checked against the rendered PDFs by
# `python -m evals.validate_golden_set` (also run by pytest and the Docker build),
# so a citation in this file is guaranteed to point at a page that says it.
#
# Schema (see evals/README.md for scoring rules):
#   id                 unique, prefix = category (COV, NC, CF, SEN, AMB)
#   category           covered | not_covered | conflict | sensitive | ambiguous
#   section            questionnaire section the question appears under
#   question           text exactly as it appears in the sample questionnaires
#   expected_status    answered | insufficient_evidence | conflict | escalated | needs_clarification
#   expected_citations [{doc, page, evidence}]  acceptable sources; evidence is a verbatim quote from that page
#   required_facts     short strings the answer must contain; each must appear in some evidence quote
#   forbidden          strings the answer must NOT contain (typical hallucinations or draft-only claims)
#   conflict           {topic, sources: [{doc, page, evidence, value}]}  both sides must be surfaced
#   route_to           legal | security | product | solutions_engineering
#   absent_terms       for not_covered: terms that must not appear in any APPROVED document
#   trap_doc           an unapproved doc that DOES contain an answer; citing it is an automatic fail
#   clarification_options  for ambiguous: the readings the agent should offer back

version: 1
knowledge_base: data/sample/kb/manifest.yaml
teams: [legal, security, product, solutions_engineering]

questions:

# ---------------------------------------------------------------------------
# 1. COVERED - answer with citation
# ---------------------------------------------------------------------------
- id: COV-001
  category: covered
  section: Data Protection
  question: Is customer data encrypted at rest? If so, which algorithm is used?
  expected_status: answered
  expected_citations:
    - {doc: KR-SEC-002, page: 2, evidence: "All customer data is encrypted at rest using AES-256."}
  required_facts: ["AES-256"]

- id: COV-002
  category: covered
  section: Data Protection
  question: What version of TLS is used to protect data in transit?
  expected_status: answered
  expected_citations:
