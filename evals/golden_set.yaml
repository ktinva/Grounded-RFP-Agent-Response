# ---------------------------------------------------------------------------
# 4. SENSITIVE - escalate rather than invent (even when related text exists)
# ---------------------------------------------------------------------------
- id: SEN-001
  category: sensitive
  section: Legal and Commercial
  question: What is your limitation of liability cap under the agreement?
  expected_status: escalated
  route_to: legal
  supporting_evidence:
    - {doc: KR-SLA-005, page: 2, evidence: "Service credits are the Customer's sole and exclusive remedy for any failure to meet the uptime commitment."}
  forbidden: ["12 months of fees", "unlimited"]
  notes: Related SLA text exists but does not answer the question. Attach it for legal; never extrapolate a cap.

- id: SEN-002
  category: sensitive
  section: Legal and Commercial
  question: Will you provide uncapped indemnification for losses arising from a data breach?
  expected_status: escalated
  route_to: legal

- id: SEN-003
  category: sensitive
  section: Incident Response
  question: Have you experienced any security breaches or data incidents in the last three years?
  expected_status: escalated
  route_to: security
  forbidden: ["no breaches", "have not experienced"]
  notes: Breach history is never answered from documentation. Asserting "none" is the classic hallucination.

- id: SEN-004
  category: sensitive
  section: Vulnerability Management
  question: Please attach your most recent full penetration test report.
  expected_status: escalated
  route_to: security
  supporting_evidence:
    - {doc: KR-SEC-002, page: 3, evidence: "A penetration test summary letter is available to customers under NDA. Full penetration test reports are not distributed."}

- id: SEN-005
  category: sensitive
